name: Build & Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Compile TypeScript
              # The @girs ambient typings carry a known baseline of type errors,
              # but JS is still emitted: the package only needs the compiled output
              run: npx tsc || true

            - name: Assemble the extension package
              run: |
                  mkdir -p stage/schemas
                  cp -r build/extension.js build/prefs.js build/src stage/
                  cp metadata.json stylesheet.css LICENSE README.md RELEASES.md stage/
                  cp -r icons po stage/
                  cp schemas/org.gnome.shell.extensions.astra-monitor.gschema.xml stage/schemas/
                  glib-compile-schemas stage/schemas
                  for po in po/*.po; do
                      lang=$(basename "$po" .po)
                      mkdir -p "stage/locale/$lang/LC_MESSAGES"
                      msgfmt -o "stage/locale/$lang/LC_MESSAGES/monitor@astraext.github.io.mo" "$po"
                  done

            - name: Pack the extension
              run: |
                  cd stage
                  zip -r "../monitor@astraext.github.io.shell-extension.zip" .

            - name: Publish the release
              uses: softprops/action-gh-release@v2
              with:
                  files: monitor@astraext.github.io.shell-extension.zip
                  generate_release_notes: true
